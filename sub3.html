<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AO Elongated Tee</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 200+ */
    .topbar {
      width: 100%;
      height: auto;
      display: block;
    }

    /* лого и кнопка */
    .top-left {
      position: absolute;
      top: 70px; 
      left: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .top-left img {
      width: 180px; 
      height: auto;
    }
    .back-btn {
      padding: 8px 18px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .back-btn:hover {
      background: #444;
    }

    /* основа и кнопка */
    .main-content {
      margin-top: 150px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img.product {
      max-width: 70%;
      height: auto;
      margin-bottom: 20px;
    }
    .buy-btn {
      padding: 12px 30px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }
    .buy-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <!-- 200+ -->
  <img src="./topbar.png" alt="Top bar" class="topbar">

  <!-- лого и кнопка -->
  <div class="top-left">
    <img src="./logo.png" alt="Logo">
    <button class="back-btn" onclick="window.location.href='./index.html'">Back Home</button>
  </div>

  <!-- основной контент -->
  <div class="main-content">
    <img src="./sub3.png" alt="AO Elongated Tee" class="product">
    <button class="buy-btn">Buy Now</button>
  </div>
</body>
</html>
